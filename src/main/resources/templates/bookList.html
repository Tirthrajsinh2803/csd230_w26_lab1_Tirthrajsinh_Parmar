<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book List</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; }
        h1 { margin-bottom: 12px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 10px; }
        th { background: #f5f5f5; text-align: left; }
        a { color: #1f6feb; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .btn {
            display:inline-block; padding:8px 12px; background:#1f6feb; color:white;
            border-radius:6px; text-decoration:none; margin:10px 0;
        }
        .btn:hover { text-decoration:none; }
        .msg { margin-top: 12px; color: #666; }
    </style>
</head>
<body>

<h1>Books</h1>

<a class="btn" href="/books/add">Add New Book</a>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Author</th>
        <th>Price</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:if="${books == null or #lists.isEmpty(books)}">
        <td colspan="4">No books found.</td>
    </tr>

    <tr th:each="b : ${books}">
        <td th:text="${b.getId()}">1</td>
        <td th:text="${b.getAuthor()}">Author</td>
        <td th:text="${b.getPrice()}">0.00</td>
        <td>
            <a th:href="@{'/books/' + ${b.getId()}}">Details</a>
            &nbsp;|&nbsp;
            <a th:href="@{'/books/edit/' + ${b.getId()}}">Edit</a>
            &nbsp;|&nbsp;
            <a th:href="@{'/books/delete/' + ${b.getId()}}"
               onclick="return confirm('Delete this book?');">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

<p class="msg">If this page loads, Spring MVC + Thymeleaf is working.</p>

</body>
</html>
