<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book List</title>
    <style>
        body { font-family: Arial, sans-serif; background:#f4f6f9; margin:0; padding:24px; }
        .card { background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:18px; max-width:1100px; margin:auto; }
        h1 { margin:0 0 14px 0; }
        .nav a { margin-right:12px; text-decoration:none; color:#2563eb; }
        table { width:100%; border-collapse: collapse; margin-top:12px; background:#fff; }
        th, td { border:1px solid #e5e7eb; padding:10px; text-align:left; }
        th { background:#f1f5f9; }
        button { padding:6px 10px; border:1px solid #cbd5e1; background:#ffffff; border-radius:6px; cursor:pointer; }
        button:hover { background:#f8fafc; }
        .muted { color:#64748b; margin-top:12px; }
    </style>
</head>
<body>
<div class="card">

    <h1>Books</h1>

    <div class="nav">
        <a th:href="@{/books}">Books</a>
        <a th:href="@{/cart}">Cart</a>
        <a th:href="@{/books/add}">Add New Book</a>
    </div>

    <table>
        <thead>
        <tr>
            <th style="width:90px;">ID</th>
            <th>Author</th>
            <th style="width:140px;">Price</th>
            <th style="width:240px;">Actions</th>
            <th style="width:140px;">Add to Cart</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="b : ${books}">
            <td th:text="${b.id}"></td>
            <td th:text="${b.author}"></td>
            <td>$<span th:text="${b.price}"></span></td>

            <td>
                <a th:href="@{'/books/' + ${b.id}}">Details</a>
                &nbsp;|&nbsp;
                <a th:href="@{'/books/edit/' + ${b.id}}">Edit</a>
                &nbsp;|&nbsp;
                <a th:href="@{'/books/delete/' + ${b.id}}">Delete</a>
            </td>

            <td>
                <form th:action="@{'/cart/add/' + ${b.id}}" method="post" style="margin:0;">
                    <button type="submit">Add</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <p class="muted">If this page loads, Spring MVC + Thymeleaf is working.</p>

</div>
</body>
</html>
