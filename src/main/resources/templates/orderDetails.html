<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Confirmation</title>
</head>
<body>

<h1>Order Confirmation</h1>

<div th:if="${order == null}">
    <p>Order not found.</p>
    <a th:href="@{/books}">Back to Books</a>
</div>

<div th:if="${order != null}">

    <p><strong>Order ID:</strong> <span th:text="${order.id}"></span></p>
    <p><strong>Order Date:</strong> <span th:text="${order.orderDate}"></span></p>
    <p><strong>Total Paid:</strong> $<span th:text="${order.totalAmount}"></span></p>

    <h2>Items Purchased</h2>

    <ul>
        <li th:each="p : ${order.products}">
            ID: <span th:text="${p.id}"></span>
            |
            Author: <span th:text="${p.author}"></span>
            |
            $<span th:text="${p.price}"></span>
        </li>
    </ul>

    <br>
    <a th:href="@{/books}">Back to Books</a>
    |
    <a th:href="@{/cart}">Back to Cart</a>

</div>

</body>
</html>
