<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cart</title>
    <style>
        body { font-family: Arial, sans-serif; background:#f4f6f9; margin:0; padding:24px; }
        .card { background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:18px; max-width:1100px; margin:auto; }
        h1 { margin:0 0 14px 0; }
        .nav a { margin-right:12px; text-decoration:none; color:#2563eb; }
        table { width:100%; border-collapse: collapse; margin-top:12px; background:#fff; }
        th, td { border:1px solid #e5e7eb; padding:10px; text-align:left; }
        th { background:#f1f5f9; }
        button { padding:6px 10px; border:1px solid #cbd5e1; background:#ffffff; border-radius:6px; cursor:pointer; }
        button:hover { background:#f8fafc; }
        .row { display:flex; gap:12px; align-items:center; margin-top:14px; }
        .muted { color:#64748b; margin-top:12px; }
    </style>
</head>
<body>
<div class="card">

    <h1>Your Cart</h1>

    <div class="nav">
        <a th:href="@{/books}">Books</a>
        <a th:href="@{/cart}">Cart</a>
    </div>

    <div th:if="${products == null or #lists.isEmpty(products)}">
        <p class="muted">Your cart is empty.</p>
        <a th:href="@{/books}">Back to Books</a>
    </div>

    <div th:if="${products != null and !#lists.isEmpty(products)}">

        <table>
            <thead>
            <tr>
                <th style="width:90px;">ID</th>
                <th>Author</th>
                <th style="width:140px;">Price</th>
                <th style="width:140px;">Remove</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${products}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.author}"></td>
                <td>$<span th:text="${p.price}"></span></td>
                <td>
                    <form th:action="@{'/cart/remove/' + ${p.id}}" method="post" style="margin:0;">
                        <button type="submit">Remove</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="row">
            <h3 style="margin:0;">Total: $<span th:text="${total}"></span></h3>

            <form th:action="@{/cart/checkout}" method="post" style="margin:0;">
                <button type="submit">Checkout</button>
            </form>
        </div>

        <p class="muted">Checkout should redirect to an order confirmation page.</p>
    </div>

</div>
</body>
</html>
