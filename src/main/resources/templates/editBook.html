<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Book</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; }
        form { max-width: 520px; }
        label { display:block; margin-top:12px; font-weight:bold; }
        input { width:100%; padding:10px; margin-top:6px; }
        button { margin-top:16px; padding:10px 14px; }
        a { color:#1f6feb; text-decoration:none; }
        a:hover { text-decoration:underline; }
        .note { color:#666; margin-top:10px; font-size: 14px; }
    </style>
</head>
<body>

<h1>Edit Book</h1>

<div th:if="${book == null}">
    <p>Book not found.</p>
    <p><a href="/books">← Back to list</a></p>
</div>

<form th:if="${book != null}" method="post" action="/books/edit">
    <!-- ID -->
    <input type="hidden" name="id" th:value="${book.getId()}">

    <!-- Title (we cannot prefill because BookEntity has no getter) -->
    <label>Title</label>
    <input type="text" name="title" placeholder="Enter title (cannot auto-fill)" required>

    <!-- Price (we CAN prefill) -->
    <label>Price</label>
    <input type="number" step="0.01" name="price" th:value="${book.getPrice()}" required>

    <!-- Quantity (we cannot prefill because BookEntity has no getter) -->
    <label>Quantity</label>
    <input type="number" name="quantity" placeholder="Enter quantity (cannot auto-fill)" required>

    <!-- Author (we CAN prefill) -->
    <label>Author</label>
    <input type="text" name="author" th:value="${book.getAuthor()}" required>

    <button type="submit">Update</button>

    <p class="note">
        Note: Title and Quantity cannot be auto-filled because your BookEntity has no getters for them (we are not editing entities).
    </p>
</form>

<p style="margin-top:16px;">
    <a href="/books">← Back to list</a>
</p>

</body>
</html>
